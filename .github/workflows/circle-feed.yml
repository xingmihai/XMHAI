name: Update Circle Feed

# 单独更新圈子数据源：抓取友链 RSS 并写入 circle-data 分支
# 与站点构建解耦，更新文章数据时不会触发整站重建
on:
  workflow_dispatch:
  schedule:
    # UTC 时间的 01:00 与 13:00，对应北京时间 09:00 与 21:00
    - cron: '0 1,13 * * *'

permissions:
  contents: write

concurrency:
  group: circle-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch feeds
        run: node scripts/fetch-circle.mjs > circle.json
        env:
          TZ: Asia/Shanghai

      - name: Show summary
        run: |
          echo "订阅源：$(node -e "console.log(require('./circle.json').sourceCount)")"
          echo "文章数：$(node -e "console.log(require('./circle.json').items.length)")"
          echo "失败数：$(node -e "console.log(require('./circle.json').failures.length)")"

      - name: Push to circle-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin circle-data >/dev/null 2>&1; then
            git fetch origin circle-data
            git switch circle-data
          else
            # 首次创建：用孤儿分支，并清空从 master 带过来的索引
            git switch --orphan circle-data
            git rm -r --cached . -q || true
          fi

          cp circle.json ./circle.json
          git add circle.json

          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: 更新圈子数据 $(date '+%Y-%m-%d %H:%M')"
          git push origin circle-data
