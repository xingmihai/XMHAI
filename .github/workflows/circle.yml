name: Update Circle Data

# 定时抓取朋友们的 RSS，只生成 circle.json 并推送到 circle-data 分支，
# 不触发整站重建（deploy.yml 只监听 master 的 push）
on:
  schedule:
    # UTC 时间的每 6 小时第 23 分钟
    # 对应北京时间 02:23 / 08:23 / 14:23 / 20:23
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      # 友链或圈子配置变动时立即刷新一次数据
      - 'src/config/friendsConfig.ts'
      - 'src/config/circleConfig.ts'
      - 'scripts/fetch-circle.ts'

permissions:
  contents: write

concurrency:
  group: circle-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch feeds
        run: pnpm run circle

      - name: Publish to circle-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 孤儿分支：每次只有一个提交，避免历史无限膨胀
          git checkout --orphan circle-data
          git rm -rf . --quiet || true
          git clean -fdx --exclude=circle.json --quiet || true

          if [ ! -f circle.json ]; then
            echo "circle.json 不存在，跳过发布"
            exit 0
          fi

          git add -f circle.json
          git commit -m "chore: 更新圈子数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin circle-data
